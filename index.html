<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Police Department - Demo Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #07111f, #12365a);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-box {
      width: 90%;
      max-width: 420px;
      background: white;
      padding: 35px;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
      text-align: center;
    }

    .badge {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #12365a;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: bold;
    }

    h1 {
      font-size: 23px;
      color: #12365a;
      margin-bottom: 8px;
    }

    h2 {
      font-size: 17px;
      color: #555;
      margin-bottom: 8px;
    }

    .demo {
      color: #b00020;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 15px;
      border: none;
      border-radius: 6px;
      background: #12365a;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #0b2742;
    }

    #message {
      margin-top: 18px;
      color: #b00020;
      font-size: 14px;
      display: none;
    }

    .footer {
      margin-top: 25px;
      font-size: 12px;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="badge">PD</div>

    <h1>Police Department</h1>
    <h2>District Administration Portal</h2>

    <div class="demo">
      DEMO / TRAINING PAGE — NOT AN OFFICIAL WEBSITE
    </div>

    <form id="loginForm">

      <input
        type="text"
        id="username"
        placeholder="Username"
        autocomplete="off"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
        autocomplete="off"
        required
      >

      <button type="submit">Sign In</button>

    </form>

    <div id="message">
      Demo login only. No username or password is transmitted.
    </div>

    <div class="footer">
      Fictional demonstration interface
    </div>

  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(event) {
      event.preventDefault();

      document.getElementById("message").style.display = "block";

      // No credentials are stored or transmitted.
      this.reset();
    });
  </script>

</body>
</html>
